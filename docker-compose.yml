version: "3.8"

services:
  plantcare-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantcare_ai_app
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=PlantCare AI
      - VERSION=1.0.0
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - MODEL_CONFIDENCE_THRESHOLD=0.70
      - DEFAULT_SEARCH_RADIUS_KM=25.0
    restart: unless-stopped
